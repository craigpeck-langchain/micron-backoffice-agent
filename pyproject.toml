[project]
name = "micron-backoffice-agent"
version = "0.1.0"
description = "Inbound email -> shipping order / purchase order / invoice / remittance advice automation demo for LangSmith Engine"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.6.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.10.9",
    "deepagents>=0.7.7",
    "python-dotenv>=1.0.1",
    "langgraph-sdk>=0.1.66",
    "fastapi>=0.115",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backoffice_agent"]
